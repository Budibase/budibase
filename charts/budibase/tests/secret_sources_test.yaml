suite: credential sources
templates:
  - templates/secrets.yaml
  - templates/app-service-deployment.yaml
  - templates/worker-service-deployment.yaml
  - templates/automation-worker-service-deployment.yaml
  - templates/litellm-migration-secret.yaml
  - templates/litellm-migration-job.yaml
release:
  name: budibase
tests:
  - it: stores configured credentials in the managed Secret
    template: templates/secrets.yaml
    set:
      globals.google.secret: example-secret
      globals.smtp.password: example-password
    asserts:
      - equal:
          path: data.google_client_secret
          value: ZXhhbXBsZS1zZWNyZXQ=
      - equal:
          path: data.smtp_pass
          value: ZXhhbXBsZS1wYXNzd29yZA==

  - it: leaves an externally managed Secret under its existing owner
    template: templates/secrets.yaml
    set:
      globals.createSecrets: false
    asserts:
      - hasDocuments:
          count: 0

  - it: reads external credentials from the fixed runtime Secret
    template: templates/app-service-deployment.yaml
    set:
      globals.createSecrets: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: api_encryption_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: google_client_secret
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BB_ADMIN_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: bb_admin_user_password
                optional: true

  - it: reads external credentials from the fixed runtime Secret in worker-service
    template: templates/worker-service-deployment.yaml
    set:
      globals.createSecrets: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: api_encryption_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: google_client_secret
                optional: true

  - it: reads external credentials from the fixed runtime Secret in automation-worker-service
    template: templates/automation-worker-service-deployment.yaml
    set:
      globals.createSecrets: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: api_encryption_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GOOGLE_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: google_client_secret
                optional: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BB_ADMIN_USER_PASSWORD
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: bb_admin_user_password
                optional: true

  - it: disables Reloader by default while preserving deployment annotations
    template: templates/app-service-deployment.yaml
    set:
      services.apps.deploymentAnnotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "false"
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform
      - notExists:
          path: spec.template.metadata.annotations["reloader.stakater.com/auto"]

  - it: enables Reloader on the Deployment when requested
    template: templates/app-service-deployment.yaml
    set:
      reloader.enabled: true
    asserts:
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: creates migration credentials before the pre-install migration hook
    template: templates/litellm-migration-secret.yaml
    set:
      services.litellm.enabled: true
      services.litellm.masterKey: example-secret
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: data.litellm_master_key
          value: ZXhhbXBsZS1zZWNyZXQ=

  - it: uses the external credentials for the migration hook
    template: templates/litellm-migration-job.yaml
    set:
      services.litellm.enabled: true
      globals.createSecrets: false
      services.litellm.extraEnv:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: budicloud-runtime
              key: litellm_database_url
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LITELLM_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: litellm_master_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: litellm_database_url

  - it: encodes numeric migration credentials with the fixed keys
    template: templates/litellm-migration-secret.yaml
    set:
      services.litellm.enabled: true
      services.litellm.masterKey: 12345
      services.litellm.saltKey: 67890
    asserts:
      - equal:
          path: data.litellm_master_key
          value: MTIzNDU=
      - equal:
          path: data.litellm_salt_key
          value: Njc4OTA=

  - it: uses the shared runtime Secret for maximum-length Helm release names
    template: templates/app-service-deployment.yaml
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      globals.createSecrets: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: api_encryption_key

  - it: keeps external runtime Secret naming stable when name overrides are set
    template: templates/app-service-deployment.yaml
    set:
      globals.createSecrets: false
      nameOverride: custom-name
      fullnameOverride: custom-fullname
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: api_encryption_key

  - it: preserves application-specific keys in the shared external Secret
    template: templates/app-service-deployment.yaml
    set:
      globals.createSecrets: false
      globals.runtimeSecretKeys.bbEncryptionKey: runtime_app_bb_encryption_key
      globals.runtimeSecretKeys.redis_password: runtime_app_redis_password
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: runtime_app_bb_encryption_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: budicloud-runtime
                key: runtime_app_redis_password

  - it: ignores external key mappings for chart-owned credentials
    template: templates/app-service-deployment.yaml
    set:
      globals.runtimeSecretKeys.bbEncryptionKey: runtime_app_bb_encryption_key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENCRYPTION_KEY
            valueFrom:
              secretKeyRef:
                name: budibase-budibase
                key: bbEncryptionKey
