suite: secrets
templates:
  - templates/secrets.yaml
release:
  name: budibase
chart:
  version: 3.0.0
  appVersion: 3.0.0
tests:
  - it: should create secret when createSecrets is true
    set:
      globals.createSecrets: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: should not create secret when createSecrets is false
    set:
      globals.createSecrets: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should be of type Opaque
    set:
      globals.createSecrets: true
    asserts:
      - equal:
          path: type
          value: Opaque

  - it: should contain all required keys
    set:
      globals.createSecrets: true
    asserts:
      - exists:
          path: data.internalApiKey
      - exists:
          path: data.jwtSecret
      - exists:
          path: data.objectStoreAccess
      - exists:
          path: data.objectStoreSecret
      - exists:
          path: data.bbEncryptionKey
      - exists:
          path: data.apiEncryptionKey

  - it: stores the configured BBAI virtual key
    set:
      services.litellm.bbaiKey: sk-bbai-test
    asserts:
      - equal:
          path: data.bbai_litellm_key
          value: c2stYmJhaS10ZXN0

  - it: uses fixed keys for core and configured credentials
    set:
      globals.internalApiKey: test-internal-key
      services.couchdb.url: http://example.com:5984
      globals.smtp.password: test-password
    asserts:
      - equal:
          path: data.internalApiKey
          value: dGVzdC1pbnRlcm5hbC1rZXk=
      - equal:
          path: data.couchdb_url
          value: aHR0cDovL2V4YW1wbGUuY29tOjU5ODQ=
      - equal:
          path: data.smtp_pass
          value: dGVzdC1wYXNzd29yZA==
