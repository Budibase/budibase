suite: secrets
templates:
  - templates/secrets.yaml
release:
  name: budibase
chart:
  version: 3.0.0
  appVersion: 3.0.0
tests:
  - it: should create secret when createSecrets is true
    set:
      globals.createSecrets: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret

  - it: should not create secret when createSecrets is false
    set:
      globals.createSecrets: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should be of type Opaque
    set:
      globals.createSecrets: true
    asserts:
      - equal:
          path: type
          value: Opaque

  - it: should contain all required keys
    set:
      globals.createSecrets: true
    asserts:
      - exists:
          path: data.internalApiKey
      - exists:
          path: data.jwtSecret
      - exists:
          path: data.objectStoreAccess
      - exists:
          path: data.objectStoreSecret
      - exists:
          path: data.bbEncryptionKey
      - exists:
          path: data.apiEncryptionKey

  - it: should populate configured credentials
    set:
      globals.createSecrets: true
      globals.google.secret: google-test
      globals.bbAdminUserPassword: admin-test
      services.litellm.masterKey: master-test
      services.litellm.saltKey: salt-test
      services.litellm.uiPassword: ui-test
    asserts:
      - equal:
          path: data.google_client_secret
          value: Z29vZ2xlLXRlc3Q=
      - equal:
          path: data.bb_admin_user_password
          value: YWRtaW4tdGVzdA==
      - equal:
          path: data.litellm_master_key
          value: bWFzdGVyLXRlc3Q=
      - equal:
          path: data.litellm_salt_key
          value: c2FsdC10ZXN0
      - equal:
          path: data.litellm_ui_password
          value: dWktdGVzdA==
