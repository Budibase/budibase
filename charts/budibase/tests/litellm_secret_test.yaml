suite: litellm secret
templates:
  - templates/litellm-secret.yaml
release:
  name: budibase
tests:
  - it: should create a secret when LiteLLM is enabled
    set:
      services.litellm.enabled: true
      services.litellm.masterKey: sk-master
      services.litellm.saltKey: sk-salt
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: budibase-budibase-litellm
      - equal:
          path: data.masterKey
          value: c2stbWFzdGVy
      - equal:
          path: data.saltKey
          value: c2stc2FsdA==

  - it: should use an existing secret instead of creating one
    set:
      services.litellm.enabled: true
      services.litellm.existingSecret: production-litellm
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create a secret when LiteLLM and its credentials are unset
    asserts:
      - hasDocuments:
          count: 0
