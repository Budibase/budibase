{{- if .Values.services.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
{{- include "budibase.deploymentAnnotations" (dict "root" . "annotations" dict) | nindent 4 }}
  name: litellm-service
  labels:
    app.kubernetes.io/name: litellm
    io.kompose.service: litellm-service
spec:
  replicas: {{ .Values.services.litellm.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: litellm-service
  template:
    metadata:
      annotations:
        ad.datadoghq.com/litellm.logs: '[{"source":"python"}]'
        checksum/litellm-config: {{ .Values.services.litellm.config | sha256sum }}
      labels:
        io.kompose.service: litellm-service
    spec:
      terminationGracePeriodSeconds: {{ .Values.services.litellm.terminationGracePeriodSeconds }}
      {{- if .Values.services.litellm.readinessGates }}
      readinessGates:
        {{- toYaml .Values.services.litellm.readinessGates | nindent 8 }}
      {{- end }}
      containers:
        - name: litellm
          image: {{ .Values.globals.dockerRegistry }}{{ .Values.services.litellm.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.litellm.port }}
          {{- if .Values.services.litellm.startupProbe }}
          startupProbe:
            {{- toYaml .Values.services.litellm.startupProbe | nindent 12 }}
          {{- end }}
          args:
            - --config
            - /app/config.yaml
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
{{- include "budibase.secretKeyRef" (dict "root" . "key" "litellm_master_key") | nindent 16 }}
            - name: LITELLM_SALT_KEY
              valueFrom:
{{- include "budibase.secretKeyRef" (dict "root" . "key" "litellm_salt_key") | nindent 16 }}
            - name: LITELLM_REASONING_AUTO_SUMMARY
              value: "true"
          {{- if or .Values.globals.existingSecret .Values.services.litellm.uiUsername }}
            - name: UI_USERNAME
              valueFrom:
{{- include "budibase.secretKeyRef" (dict "root" . "key" "litellm_ui_username") | nindent 16 }}
          {{- end }}
          {{- if or .Values.globals.existingSecret .Values.services.litellm.uiPassword }}
            - name: UI_PASSWORD
              valueFrom:
{{- include "budibase.secretKeyRef" (dict "root" . "key" "litellm_ui_password") | nindent 16 }}
          {{- end }}
          {{- if .Values.services.litellm.extraEnv }}
            {{- toYaml .Values.services.litellm.extraEnv | nindent 12 }}
          {{- end }}
          {{- if .Values.services.litellm.migrationJob.enabled }}
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          {{- end }}
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
          {{- with .Values.services.litellm.resources }}
          resources:
{{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.services.litellm.extraVolumeMounts }}
{{- toYaml .Values.services.litellm.extraVolumeMounts | nindent 10 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.services.litellm.preStopDelaySeconds }}"]
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
      {{- if .Values.services.litellm.extraVolumes }}
{{- toYaml .Values.services.litellm.extraVolumes | nindent 6 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName | quote }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | nindent 6 }}
      {{- end }}
{{- end }}
