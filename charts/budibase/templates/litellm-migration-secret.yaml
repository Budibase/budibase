{{- if and .Values.services.litellm.enabled .Values.services.litellm.migrationJob.enabled .Values.globals.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budibase.fullname" . }}-litellm-migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ sub (.Values.services.litellm.migrationJob.hookWeight | int) 1 | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  litellm_master_key: {{ .Values.services.litellm.masterKey | default "" | toString | b64enc | quote }}
  litellm_salt_key: {{ .Values.services.litellm.saltKey | default "" | toString | b64enc | quote }}
{{- end }}
