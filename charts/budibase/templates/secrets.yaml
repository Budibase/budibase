{{- if .Values.globals.createSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budibase.fullname" . }}
  labels:
    app: {{ include "budibase.fullname" . }}
    chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
    release: {{ .Release.Name | quote }}
    heritage: {{ .Release.Service | quote }}
type: Opaque
data:
{{- include "budibase.secretData" . | nindent 2 }}
{{- end }}
