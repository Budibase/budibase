{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (include "budibase.fullname" .) }}
{{- if and .Values.globals.createSecrets (not .Values.globals.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "budibase.fullname" . }}
  labels:
    app: {{ template "budibase.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
type: Opaque
data:
  {{- if $existingSecret }}
  {{ default "internalApiKey" (get .Values.globals.secretKeyMapping "internalApiKey") }}: {{ index $existingSecret.data "internalApiKey" | quote }}
  {{ default "jwtSecret" (get .Values.globals.secretKeyMapping "jwtSecret") }}: {{ index $existingSecret.data "jwtSecret" | quote }}
  {{ default "objectStoreAccess" (get .Values.globals.secretKeyMapping "objectStoreAccess") }}: {{ index $existingSecret.data "objectStoreAccess" | quote }}
  {{ default "objectStoreSecret" (get .Values.globals.secretKeyMapping "objectStoreSecret") }}: {{ index $existingSecret.data "objectStoreSecret" | quote }}
  {{ default "bbEncryptionKey" (get .Values.globals.secretKeyMapping "bbEncryptionKey") }}: {{ index $existingSecret.data "bbEncryptionKey" | quote }}
  {{ default "apiEncryptionKey" (get .Values.globals.secretKeyMapping "apiEncryptionKey") }}: {{ index $existingSecret.data "apiEncryptionKey" | quote }}
  {{- else }}
  {{ default "internalApiKey" (get .Values.globals.secretKeyMapping "internalApiKey") }}: {{ template "budibase.defaultsecret" .Values.globals.internalApiKey }}
  {{ default "jwtSecret" (get .Values.globals.secretKeyMapping "jwtSecret") }}: {{ template "budibase.defaultsecret" .Values.globals.jwtSecret }}
  {{ default "objectStoreAccess" (get .Values.globals.secretKeyMapping "objectStoreAccess") }}: {{ template "budibase.defaultsecret" .Values.services.objectStore.accessKey }}
  {{ default "objectStoreSecret" (get .Values.globals.secretKeyMapping "objectStoreSecret") }}: {{ template "budibase.defaultsecret" .Values.services.objectStore.secretKey }}
  {{ default "bbEncryptionKey" (get .Values.globals.secretKeyMapping "bbEncryptionKey") }}: {{ template "budibase.defaultsecret" .Values.globals.bbEncryptionKey }}
  {{ default "apiEncryptionKey" (get .Values.globals.secretKeyMapping "apiEncryptionKey") }}: {{ template "budibase.defaultsecret" .Values.globals.apiEncryptionKey }}
  {{- end }}
  couchdb_url: {{ default (printf "http://%s-svc-couchdb:%v" .Release.Name .Values.services.couchdb.port) .Values.services.couchdb.url | default "" | toString | b64enc | quote }}
  internal_api_key_fallback: {{ .Values.globals.internalApiKeyFallback | default "" | toString | b64enc | quote }}
  jwt_secret_fallback: {{ .Values.globals.jwtSecretFallback | default "" | toString | b64enc | quote }}
  cloudfront_private_key_64: {{ .Values.services.objectStore.cloudfront.privateKey64 | default "" | toString | b64enc | quote }}
  redis_password: {{ .Values.services.redis.password | default "" | toString | b64enc | quote }}
  redis_username: {{ .Values.services.redis.username | default "" | toString | b64enc | quote }}
  posthog_token: {{ .Values.globals.posthogToken | default "" | toString | b64enc | quote }}
  litellm_master_key: {{ .Values.services.litellm.masterKey | default "" | toString | b64enc | quote }}
  bbai_litellm_key: {{ .Values.services.litellm.bbaiKey | default "" | toString | b64enc | quote }}
  account_portal_api_key: {{ .Values.globals.accountPortalApiKey | default "" | toString | b64enc | quote }}
  google_client_id: {{ .Values.globals.google.clientId | default "" | toString | b64enc | quote }}
  google_client_secret: {{ .Values.globals.google.secret | default "" | toString | b64enc | quote }}
  bb_admin_user_password: {{ .Values.globals.bbAdminUserPassword | default "" | toString | b64enc | quote }}
  smtp_user: {{ .Values.globals.smtp.user | default "" | toString | b64enc | quote }}
  smtp_pass: {{ .Values.globals.smtp.password | default "" | toString | b64enc | quote }}
  litellm_salt_key: {{ .Values.services.litellm.saltKey | default "" | toString | b64enc | quote }}
  litellm_ui_username: {{ .Values.services.litellm.uiUsername | default "" | toString | b64enc | quote }}
  litellm_ui_password: {{ .Values.services.litellm.uiPassword | default "" | toString | b64enc | quote }}
{{- end }}
