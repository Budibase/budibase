{{- $secretName := .Values.globals.secretName | default (include "budibase.fullname" .) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if .Values.globals.createSecrets }}
{{- $secretDefaults := dict
  "internalApiKey" (include "budibase.defaultsecret" .Values.globals.internalApiKey | trimAll "\"")
  "jwtSecret" (include "budibase.defaultsecret" .Values.globals.jwtSecret | trimAll "\"")
  "objectStoreAccess" (include "budibase.defaultsecret" .Values.services.objectStore.accessKey | trimAll "\"")
  "objectStoreSecret" (include "budibase.defaultsecret" .Values.services.objectStore.secretKey | trimAll "\"")
  "bbEncryptionKey" (include "budibase.defaultsecret" .Values.globals.bbEncryptionKey | trimAll "\"")
  "apiEncryptionKey" (include "budibase.defaultsecret" .Values.globals.apiEncryptionKey | trimAll "\"")
  "internal_api_key_fallback" (.Values.globals.internalApiKeyFallback | toString | b64enc)
  "jwt_secret_fallback" (.Values.globals.jwtSecretFallback | toString | b64enc)
  "cloudfront_private_key_64" (.Values.services.objectStore.cloudfront.privateKey64 | toString | b64enc)
  "redis_password" (.Values.services.redis.password | toString | b64enc)
  "litellm_master_key" (.Values.services.litellm.masterKey | toString | b64enc)
  "bbai_litellm_key" (.Values.services.litellm.bbaiKey | toString | b64enc)
  "account_portal_api_key" (.Values.globals.accountPortalApiKey | toString | b64enc)
  "google_client_secret" (.Values.globals.google.secret | toString | b64enc)
  "bb_admin_user_password" (.Values.globals.bbAdminUserPassword | toString | b64enc)
  "smtp_pass" (.Values.globals.smtp.password | toString | b64enc)
  "litellm_salt_key" (.Values.services.litellm.saltKey | toString | b64enc)
  "litellm_ui_password" (.Values.services.litellm.uiPassword | toString | b64enc)
}}
{{- $secretData := $secretDefaults }}
{{- if $existingSecret }}
{{- $secretData = merge $existingSecret.data $secretDefaults }}
{{- if and .Values.globals.bbAdminUserPassword (empty (index $existingSecret.data "bb_admin_user_password")) }}
{{- $_ := set $secretData "bb_admin_user_password" (.Values.globals.bbAdminUserPassword | toString | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: {{ template "budibase.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
type: Opaque
data:
{{- toYaml $secretData | nindent 2 }}
{{- end }}
