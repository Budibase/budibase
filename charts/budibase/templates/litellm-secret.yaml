{{- if and (not .Values.services.litellm.existingSecret) (or .Values.services.litellm.enabled .Values.services.litellm.masterKey .Values.services.litellm.saltKey .Values.services.litellm.bbaiKey .Values.services.litellm.uiUsername .Values.services.litellm.uiPassword) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "budibase.litellmSecretName" . }}
  labels:
    {{- include "budibase.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
type: Opaque
data:
  masterKey: {{ .Values.services.litellm.masterKey | b64enc | quote }}
  saltKey: {{ .Values.services.litellm.saltKey | b64enc | quote }}
  bbaiKey: {{ .Values.services.litellm.bbaiKey | b64enc | quote }}
  uiUsername: {{ .Values.services.litellm.uiUsername | b64enc | quote }}
  uiPassword: {{ .Values.services.litellm.uiPassword | b64enc | quote }}
{{- end }}
