{{- if and .Values.services.litellm.enabled .Values.services.litellm.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "budibase.fullname" . }}-litellm
  labels:
    {{- include "budibase.labels" . | nindent 4 }}
    app.kubernetes.io/component: litellm
spec:
  podSelector:
    matchLabels:
      io.kompose.service: litellm-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: app-service
        - podSelector:
            matchLabels:
              io.kompose.service: worker-service
        - podSelector:
            matchLabels:
              io.kompose.service: automation-worker-service
      ports:
        - protocol: TCP
          port: {{ .Values.services.litellm.port }}
    {{- with .Values.services.litellm.networkPolicy.additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
