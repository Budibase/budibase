name: Configure infrastructure Ops credential

on:
  push:
    branches: [automation/ops-project-intake]
    paths: [.github/workflows/configure-infrastructure-ops-credential.yml]

permissions: {}

jobs:
  configure:
    if: github.repository == 'Budibase/budibase'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Store existing credential in infrastructure Actions secrets
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          printf '%s' "$GH_TOKEN" | gh secret set OPS_PROJECT_TOKEN --repo Budibase/infrastructure
