name: Check Ops project automation access

on:
  push:
    branches: [automation/ops-project-intake]
    paths: [.github/workflows/check-ops-project-access.yml]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        secret: [GH_ACCESS_TOKEN, PERSONAL_ACCESS_TOKEN]
    name: Check ${{ matrix.secret }}
    steps:
      - name: Check issue reading and project updates
        env:
          GH_TOKEN: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Credential is unavailable."
            exit 1
          fi
          gh api graphql -f query='query { organization(login:"Budibase") { projectV2(number:22) { id } repositories(first:100) { totalCount nodes { name issues(first:1) { totalCount } } } } }' --jq '{project_access: (.data.organization.projectV2.id != null), visible_repositories: .data.organization.repositories.totalCount}'
          # Re-adding an existing active item checks write access without changing it.
          gh api graphql -f query='mutation { addProjectV2ItemById(input:{projectId:"PVT_kwDOAq7LP84BFtOT",contentId:"I_kwDOC15Oss8AAAABJu0N5g"}) { item { id } } }' --jq '{project_write_access: (.data.addProjectV2ItemById.item.id != null)}'
